<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mane</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      width: 240px;
      margin: 0;
      padding: 14px 16px;
    }
    h1 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
    .status { font-size: 12px; opacity: 0.7; margin-bottom: 10px; }
    .count { font-size: 22px; font-weight: 500; margin-bottom: 14px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .row-label { font-size: 13px; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: color-mix(in srgb, currentColor 18%, transparent);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s ease;
      user-select: none;
    }
    .switch.on { background: rgb(50, 195, 105); }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }
    .switch.on::after { transform: translateX(18px); }
    .switch.disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Mane</h1>
  <div class="status" id="status">Loading…</div>
  <div class="count" id="count">—</div>
  <div class="row">
    <span class="row-label">Blocking</span>
    <div class="switch disabled" id="toggle" role="switch" aria-checked="false" tabindex="0"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
