[package]
name = "mane-engine"
version = "0.1.0"
description = "Mac-side wrapper around Brave's adblock-rust engine"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
adblock = { version = "0.12.5", features = ["content-blocking"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29.2"
